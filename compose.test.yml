name: tecnojack-test

services:
  postgres-test:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_DB: tecnojack_test
      POSTGRES_USER: tecnojack
      POSTGRES_PASSWORD: tecnojack
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tecnojack -d tecnojack_test']
      interval: 3s
      timeout: 3s
      retries: 10
