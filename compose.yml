name: tecnojack

services:
  postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_DB: tecnojack
      POSTGRES_USER: tecnojack
      POSTGRES_PASSWORD: tecnojack
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tecnojack -d tecnojack']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      target: development
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://tecnojack:tecnojack@postgres:5432/tecnojack?schema=public
      JWT_SECRET: local-development-secret-with-32-characters
      CORS_ORIGINS: http://localhost:4200
      LOG_PRETTY: 'true'
      SWAGGER_ENABLED: 'true'
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/v1/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: development
    environment:
      DATABASE_URL: postgresql://tecnojack:tecnojack@postgres:5432/tecnojack?schema=public
    command: ['pnpm', 'prisma:migrate:deploy']
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['tools']

volumes:
  postgres_data:
